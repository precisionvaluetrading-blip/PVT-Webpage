<head>

  <meta charset="UTF-8">

    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Financial Consistency Ecosystem | Documentation
  </title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>


  <style>

    /* =====================================================
       GLOBAL
    ===================================================== */

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }


    /* =====================================================
       SOCIAL LINKS
    ===================================================== */

    .social-links {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .social-links a {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #111;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease,
        box-shadow 0.2s ease;
    }

    .social-links a:hover {
      transform: translateY(-3px);
      opacity: 0.8;
      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.18);
    }

    .social-links svg {
      width: 20px;
      height: 20px;
    }

    .social-links .icon-fill {
      fill: white;
    }

    .social-links .icon-stroke {
      fill: none;
      stroke: white;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }


    /* =====================================================
       PROFESSIONAL POPUP
    ===================================================== */

    .popup-overlay {
      position: fixed;

      inset: 0;

      background: rgba(0, 0, 0, 0.72);

      backdrop-filter: blur(6px);

      display: none;

      align-items: center;
      justify-content: center;

      z-index: 9999;

      padding: 20px;
    }


    .popup-box {
      position: relative;

      width: 100%;

      max-width: 440px;

      padding: 42px 35px;

      text-align: center;

      background: #111;

      color: #fff;

      border:
        1px solid
        rgba(255, 255, 255, 0.15);

      border-radius: 18px;

      box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.45);
    }


    .popup-icon {
      font-size: 25px;

      margin-bottom: 12px;
    }


    .popup-box h2 {
      margin: 0 0 15px;

      font-size: 27px;

      font-weight: 600;
    }


    .popup-box p {
      margin: 0 auto 28px;

      max-width: 360px;

      color: #bdbdbd;

      font-size: 15px;

      line-height: 1.7;
    }


    .manager-button {
      display: inline-block;

      padding: 13px 24px;

      border-radius: 8px;

      background: #fff;

      color: #111;

      text-decoration: none;

      font-size: 14px;

      font-weight: 600;

      transition: 0.2s ease;
    }


    .manager-button:hover {
      transform: translateY(-2px);

      opacity: 0.85;
    }


    .popup-close {
      position: absolute;

      top: 14px;
      right: 17px;

      border: 0;

      background: transparent;

      color: #aaa;

      font-size: 28px;

      cursor: pointer;
    }


    .popup-close:hover {
      color: #fff;
    }


    /* =====================================================
       OFFICE LOCATION
    ===================================================== */

    .office-location {
      display: flex;

      align-items: flex-start;

      gap: 14px;

      max-width: 420px;

      padding: 20px;

      border-radius: 12px;

      background: #f8f8f8;
    }


    .office-icon {
      font-size: 24px;

      line-height: 1;
    }


    .office-info h3 {
      margin: 0 0 6px;

      font-size: 18px;

      font-weight: 600;

      color: #111;
    }


    .office-info p {
      margin: 0 0 10px;

      font-size: 14px;

      color: #666;
    }


    .office-info a {
      font-size: 14px;

      font-weight: 500;

      color: #111;

      text-decoration: none;
    }


    .office-info a:hover {
      text-decoration: underline;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 768px) {

      .social-links a {
        width: 34px;
        height: 34px;
      }

      .social-links svg {
        width: 18px;
        height: 18px;
      }

      .popup-box {
        padding:
          38px
          24px
          32px;
      }

      .popup-box h2 {
        font-size: 24px;
      }

    }

  </style>

</head>
